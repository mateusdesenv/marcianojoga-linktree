name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project files
        run: test -s index.html && test -s styles.css && test -s script.js && test -s assets/marcianojoga-avatar.png

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check internal asset references
        run: |
          grep -q 'styles.css' index.html
          grep -q 'script.js' index.html
          grep -q 'assets/marcianojoga-avatar.png' index.html
